[package]
name = "musubi-bench"
version = "0.1.0"
edition = "2021"
description = "ANN-Benchmarks evaluation for the musubi HNSW implementation"
publish = false

[[bin]]
name = "bench_ann"
path = "src/main.rs"

[dependencies]
musubi = { path = ".." }
hdf5 = { package = "hdf5-metno", version = "0.15" }
ndarray = "0.15"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
